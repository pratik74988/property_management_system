<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Partners | Shivtej</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --ink: #111318; --muted: #6b7280; --line: #e5e7eb;
            --bg: #f9fafb; --white: #ffffff; --accent: #e05c2a;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); }

        nav {
            background: var(--white); border-bottom: 1px solid var(--line);
            padding: 0 32px; height: 60px; display: flex;
            align-items: center; justify-content: space-between;
        }
        .nav-brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.25rem; color: var(--ink); text-decoration: none; }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a { font-size: 0.875rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; }
        .nav-links a:hover { color: var(--ink); background: var(--bg); }

        /* ── HERO ── */
        .hero {
            background: var(--ink); color: var(--white);
            padding: 64px 32px 56px; text-align: center;
            position: relative; overflow: hidden;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse 60% 60% at 30% 110%, #e05c2a2a, transparent);
        }
        .hero h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800; letter-spacing: -1px; position: relative;
        }
        .hero p { margin-top: 10px; color: #9ca3af; font-size: 1rem; position: relative; }

        /* ── PARTNERS GRID ── */
        .container { max-width: 900px; margin: 0 auto; padding: 56px 16px 80px; }

        .partners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .partner-tile {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 24px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 3/2;
            transition: box-shadow 0.15s, border-color 0.15s, transform 0.15s;
            text-decoration: none;
        }
        .partner-tile:hover {
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            border-color: #d1d5db;
            transform: translateY(-2px);
        }
        .partner-tile img {
            max-width: 100%;
            max-height: 70px;
            object-fit: contain;
            filter: grayscale(30%);
            transition: filter 0.2s;
        }
        .partner-tile:hover img { filter: grayscale(0%); }

        /* no-link tile */
        div.partner-tile { cursor: default; }
        div.partner-tile:hover { transform: none; box-shadow: none; border-color: var(--line); }

        .empty-state {
            text-align: center; color: var(--muted); padding: 80px 20px;
            border: 1px dashed var(--line); border-radius: 12px;
        }
        .empty-state p:first-child { font-size: 2.5rem; margin-bottom: 12px; }
    </style>
</head>
<body>

<nav>
    <a class="nav-brand" href="/">Shivtej</a>
    <div class="nav-links">
        <a href="/">Properties</a>
        <a href="/partners/" style="color:var(--ink);font-weight:600;">Our Partners</a>
    </div>
</nav>

<div class="hero">
    <h1>Our Partners</h1>
    <p>Trusted brands and companies we work with</p>
</div>

<div class="container">
    {% if partners %}
        <div class="partners-grid">
            {% for partner in partners %}
                {% if partner.website %}
                    <a href="{{ partner.website }}" target="_blank" rel="noopener" class="partner-tile" title="{{ partner.name }}">
                        <img src="{{ partner.logo.url }}" alt="{{ partner.name }}">
                    </a>
                {% else %}
                    <div class="partner-tile" title="{{ partner.name }}">
                        <img src="{{ partner.logo.url }}" alt="{{ partner.name }}">
                    </div>
                {% endif %}
            {% endfor %}
        </div>
    {% else %}
        <div class="empty-state">
            <p>🤝</p>
            <p>No partners listed yet.</p>
        </div>
    {% endif %}
</div>

</body>
</html>
